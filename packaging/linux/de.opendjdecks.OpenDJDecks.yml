# Flatpak manifest. Build: flatpak-builder --user --install build packaging/linux/de.opendjdecks.OpenDJDecks.yml
app-id: de.opendjdecks.OpenDJDecks
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
sdk-extensions: [org.freedesktop.Sdk.Extension.rust-stable]
command: opendjdecks
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=all          # controllers (MIDI) and audio interfaces
  - --socket=pulseaudio
  - --filesystem=xdg-music
  - --filesystem=/media   # USB sticks
  - --filesystem=/run/media
  - --talk-name=org.freedesktop.UDisks2
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/opendjdecks/cargo
modules:
  - name: rubberband
    buildsystem: meson
    config-opts: [-Dfft=builtin, -Dresampler=builtin, -Dtests=disabled, -Dcmdline=disabled]
    sources:
      - type: archive
        url: https://breakfastquay.com/files/releases/rubberband-4.0.0.tar.bz2
        sha256: af050313ee63bc18b35b2e064e5dce05b276aaf6d1aa2b8a82ced1fe2f8028e9
  - name: opendjdecks
    buildsystem: simple
    build-options:
      build-args: [--share=network]
    build-commands:
      - cargo build --release --locked -p opendjdecks
      - install -Dm755 target/release/opendjdecks /app/bin/opendjdecks
      - mkdir -p /app/share/opendjdecks && cp -R mappings /app/share/opendjdecks/
      - install -Dm644 packaging/linux/de.opendjdecks.OpenDJDecks.desktop /app/share/applications/de.opendjdecks.OpenDJDecks.desktop
      - install -Dm644 packaging/linux/de.opendjdecks.OpenDJDecks.metainfo.xml /app/share/metainfo/de.opendjdecks.OpenDJDecks.metainfo.xml
      - install -Dm644 packaging/assets/icon.svg /app/share/icons/hicolor/scalable/apps/de.opendjdecks.OpenDJDecks.svg
      - for s in 48 128 256 512; do install -Dm644 packaging/assets/icon-$s.png /app/share/icons/hicolor/${s}x${s}/apps/de.opendjdecks.OpenDJDecks.png; done
    sources:
      - type: dir
        path: ../..
