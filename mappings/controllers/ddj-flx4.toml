channel = "deck"

[[output]]
target = "deck.loop_active"
note = 0x4D
channel = "deck"

[[output]]
target = "deck.loop_active"
note = 0x50
channel = "deck"

[[output]]
target = "deck.vinyl"
note = 0x17
channel = "deck"
