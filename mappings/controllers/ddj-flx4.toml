note = 0x17
channel = "deck"

[[output]]
target = "mixer.cue"
note = 0x54
channel = "deck"

[[output]]
target = "mixer.vu"
cc = 0x02
channel = "deck"

# Track load illumination [L]: 0x7F starts the animation.
[[output]]
target = "deck.loaded"
note = 0x00
channel = 15
deck = 1

[[output]]
target = "deck.loaded"
note = 0x01
channel = 15
deck = 2

# Not in [L] or [M] (channel 15 has only notes 0x00 / 0x01 there).
[[output]]
target = "deck.loop_active"
note = 0x04
channel = 15
deck = 1
verify = true

[[output]]
target = "deck.loop_active"
note = 0x05
channel = 15
deck = 2
verify = true

[[output]]
target = "deck.pad_mode"
