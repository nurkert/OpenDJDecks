args = { mode = "hold_fx2" }

[[output]]
target = "deck.pad_mode"
note = 0x20
channel = "deck"
args = { mode = "beat_jump" }

[[output]]
target = "deck.pad_mode"
note = 0x6D
channel = "deck"
