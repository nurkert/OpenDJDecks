channel = 15
deck = 2
verify = true

[[output]]
target = "deck.pad_mode"
note = 0x1B
channel = "deck"
args = { mode = "hot_cue" }

[[output]]
target = "deck.pad_mode"
note = 0x69
channel = "deck"
args = { mode = "keyboard" }

[[output]]
target = "deck.pad_mode"
note = 0x1E
channel = "deck"
args = { mode = "hold_fx1" }

[[output]]
target = "deck.pad_mode"
note = 0x6B
channel = "deck"
args = { mode = "hold_fx2" }

[[output]]
target = "deck.pad_mode"
note = 0x20
channel = "deck"
args = { mode = "beat_jump" }

[[output]]
target = "deck.pad_mode"
note = 0x6D
channel = "deck"
args = { mode = "beat_loop" }

[[output]]
target = "deck.pad_mode"
note = 0x22
channel = "deck"
args = { mode = "sampler" }

[[output]]
target = "deck.pad_mode"
note = 0x6F
channel = "deck"
args = { mode = "key_shift" }

# Pad LEDs: one block of notes per pad mode, same numbers as the inputs.
[[output]]
target = "deck.pad"
note = 0x00
repeat = 8
index_arg = "index"
channel = "pad"
args = { mode = "hot_cue" }

[[output]]
