[[output]]
target = "mixer.cue"
note = 0x54
channel = "deck"

[[output]]
verify = true
target = "mixer.vu"
cc = 0x02
channel = "deck"

[[output]]
verify = true
target = "deck.loaded"
note = 0x00
channel = 15
deck = 1

[[output]]
verify = true
target = "deck.loaded"
note = 0x01
channel = 15
deck = 2

[[output]]
target = "deck.loop_active"
note = 0x04
channel = 15
deck = 1
