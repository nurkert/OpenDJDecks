channel = 6
deck = 1
action = "deck.load"
confirmed = true

[[input]]
name = "Browse press (deck 2 active)"
note = 0x47
channel = 6
deck = 2
action = "deck.load"
confirmed = true

[[input]]
name = "Browse press (deck 3 active)"
note = 0x48
channel = 6
deck = 3
action = "deck.load"

[[input]]
name = "Browse press (deck 4 active)"
note = 0x49
channel = 6
deck = 4
action = "deck.load"

# SHIFT + BROWSE press, one note per active deck [L].
[[input]]
name = "Browse press (shift, deck 1 active)"
note = 0x5D
channel = 6
action = "browse.press"
args = { shifted = true }

[[input]]
name = "Browse press (shift, deck 2 active)"
note = 0x6D
channel = 6
action = "browse.press"
args = { shifted = true }

[[input]]
name = "Browse press (shift, deck 3 active)"
note = 0x5E
channel = 6
action = "browse.press"
args = { shifted = true }

[[input]]
name = "Browse press (shift, deck 4 active)"
note = 0x6F
channel = 6
action = "browse.press"
args = { shifted = true }

# ---------------------------------------------------------------- deck layers
# DECK 1/3 and DECK 2/4: the unit reports the deck that became active with
# 0x3C = 0x7F on its channel and 0x3C = 0x00 on the other deck of the side
# [L]. 0x72 comes on the deck 3/4 channel for both buttons of a side, so it
# does not tell which deck is active.
[[input]]
name = "Deck select"
note = 0x3C
channel = "deck"
action = "deck.select"
confirmed = true

[[input]]
name = "Deck select button"
note = 0x72
channel = "deck"
action = "ignore"

[[input]]
name = "Deck select 1/3 (shift)"
note = 0x7C
channel = 6
action = "ignore"

[[input]]
name = "Deck select 2/4 (shift)"
note = 0x7D
channel = 6
action = "ignore"

