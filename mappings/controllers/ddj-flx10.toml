args = { effect = [
  "low_cut_echo", "echo", "multi_tap_delay", "spiral", "reverb", "trans", "enigma_jet",
  "flanger", "phaser", "stretch", "slip_roll", "roll", "mobius_saw", "mobius_triangle",
] }

