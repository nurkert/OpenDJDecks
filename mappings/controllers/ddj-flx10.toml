[[input]]
name = "Pad mode hold FX 1"
note = 0x1E
channel = "deck"
action = "deck.pad_mode"
args = { mode = "hold_fx1" }

[[input]]
name = "Pad mode hold FX 2 (shift)"
note = 0x6B
channel = "deck"
action = "deck.pad_mode"
args = { mode = "hold_fx2" }

[[input]]
name = "Pad mode beat jump"
note = 0x20
channel = "deck"
action = "deck.pad_mode"
args = { mode = "beat_jump" }

[[input]]
name = "Pad mode beat loop (shift)"
note = 0x6D
channel = "deck"
action = "deck.pad_mode"
args = { mode = "beat_loop" }

[[input]]
name = "Pad mode sampler"
note = 0x22
channel = "deck"
