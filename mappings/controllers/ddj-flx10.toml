# OpenDJDecks controller mapping: DDJ-FLX10 (4 decks)
#
# SPDX-License-Identifier: GPL-3.0-or-later
# Authored independently for OpenDJDecks in its own schema (see
# docs/controller-mappings.md). The model name is used only to name the
# hardware this file is compatible with.
#
# MIDI message facts: [L] the manufacturer's published MIDI message list for
# this model (facts only); [M] Mixxx project mappings of the same controller
# family (offset-64 jog encoding, 14-bit LSB = MSB + 0x20, pad note blocks per
# pad mode).
#
# Entries with `confirmed = true` were checked on the owner's unit on
# 2026-11-13 (the controls were used in OpenDJDecks and their messages
# recorded with the MIDI monitor); everything else is not confirmed live yet. Entries marked
# `verify = true` are not backed by a public source yet and need a check on
# real hardware.
#
# Seen on that unit: with deck 3 or 4 active (and with SHIFT), the unit sends
# a deck control on both deck channels of its side at once, the active deck
# first; the controller layer keeps the first (`ControllerSession::is_mirror`).
# Confirm everything with:
#   cargo run -p od-controller --example midi_monitor -- --mapping mappings/controllers/ddj-flx10.toml
#
# Wire channels: decks 1–4 = 0–3; pads deck 1–4 = 7, 9, 11, 13 (shift
# 8, 10, 12, 14); tempo FX = 4; global mixer/browser = 6; indicators = 15.
# The DECK 1/3 and DECK 2/4 buttons switch layers in hardware: the unit
# then sends on the channel of the selected deck, so channel sets name decks
# directly and `[layers] mode = "hardware"` only tracks the active deck (for
# soft takeover of the tempo fader after a layer switch).

schema = 1

[device]
id = "ddj-flx10"
name = "DDJ-FLX10"
vendor = "Pioneer DJ"
model = "DDJ-FLX10"
decks = 4
module = "jog-controller"
sources = [
  "Manufacturer's MIDI message list for this model (facts only)",
  "Mixxx mappings of the same controller family (facts only)",
]

[device.match]
port_names = ["DDJ-FLX10"]
usb_vendor_id = 0x2B73
usb_product_id = 0x0041

[channels]
deck = [0, 1, 2, 3]
pad = [7, 9, 11, 13]
pad_shift = [8, 10, 12, 14]

[layers]
mode = "hardware"
sides = [[1, 3], [2, 4]]

[options]
soft_takeover = true
takeover_threshold = 0.03
# About 4800 steps for one hand-turned revolution on the owner's unit (side
# of the platter, 2026-11-13); still to confirm with more turns.
jog_ticks_per_revolution = 4800
meter_interval_ms = 33

# Asks the unit for the positions of all its faders, knobs and switches; it
# answers at once with one message per control, so the app knows where the
# channel faders stand without them being moved. The request follows the
# Mixxx mappings of smaller models of the family; this model number was found
# on the owner's unit on 2026-11-14 (four others got no answer).
[[init]]
bytes = [0xF0, 0x00, 0x40, 0x05, 0x00, 0x00, 0x04, 0x01, 0x00, 0x03, 0x01, 0xF7]

# Placeholder pad colour palette (velocity value -> colour). The real
# velocity/colour table has to be measured with `midi_monitor --leds`.
[[palettes.pads]]
value = 0x01
color = "#ff0000"
[[palettes.pads]]
value = 0x05
color = "#ff8000"
[[palettes.pads]]
value = 0x0A
color = "#ffff00"
[[palettes.pads]]
value = 0x14
color = "#00ff00"
[[palettes.pads]]
value = 0x1E
color = "#00ffff"
[[palettes.pads]]
value = 0x28
color = "#0000ff"
[[palettes.pads]]
value = 0x32
color = "#8000ff"
[[palettes.pads]]
value = 0x3C
color = "#ff00ff"
[[palettes.pads]]
value = 0x7F
color = "#ffffff"

