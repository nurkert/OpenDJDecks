lsb = 0x22
channel = 4
action = "tempo_fx.level"

[[input]]
name = "Tempo FX on"
note = 0x47
channel = 4
action = "tempo_fx.toggle"

[[input]]
name = "Tempo FX release (shift)"
note = 0x43
channel = 4
action = "tempo_fx.release"

