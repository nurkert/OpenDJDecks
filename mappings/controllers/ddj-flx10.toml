repeat = 4
channel = 4
action = "tempo_fx.assign"
args = { channel = [1, 2, 3, 4] }

[[input]]
name = "Tempo FX channel master"
note = 0x14
channel = 4
action = "tempo_fx.assign"
args = { channel = 0 }

[[input]]
name = "Tempo FX channel mic/sampler"
note = 0x15
repeat = 2
channel = 4
action = "ignore"

[[input]]
name = "Tempo FX level"
