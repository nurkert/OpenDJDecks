[[input]]
name = "Pad mode key shift (shift)"
note = 0x6F
channel = "deck"
action = "deck.pad_mode"
args = { mode = "key_shift" }

# PAGE buttons left/right of the pads, one note per pad mode [L]: 0x24-0x2B
# left, 0x2C-0x33 right (hot cue, pad FX 1, beat jump, sampler, keyboard,
# pad FX 2, beat loop, key shift). They pick page 1 / page 2, and the unit
# itself then sends the pads' page 1 / page 2 notes. Only the sampler ones
# have a function (bank down / up; an absolute page action does not exist).
[[input]]
name = "Pad page left"
note = 0x24
repeat = 3
channel = "deck"
action = "ignore"

[[input]]
name = "Pad page left"
note = 0x28
repeat = 4
channel = "deck"
action = "ignore"

[[input]]
name = "Pad page right"
note = 0x2C
repeat = 3
channel = "deck"
action = "ignore"

[[input]]
name = "Pad page right"
note = 0x30
repeat = 4
channel = "deck"
action = "ignore"

[[input]]
name = "Sampler bank down"
note = 0x27
channel = "deck"
action = "sampler.bank_prev"

[[input]]
name = "Sampler bank up"
note = 0x2F
channel = "deck"
action = "sampler.bank_next"

# PAGE left / right with SHIFT, one note per pad mode in the same order [L].
[[input]]
name = "Pad page left (shift)"
note = 0x01
repeat = 8
channel = "deck"
action = "ignore"

[[input]]
name = "Pad page right (shift)"
note = 0x09
channel = "deck"
action = "ignore"

[[input]]
name = "Pad page right (shift)"
note = 0x7A
repeat = 6
channel = "deck"
action = "ignore"

[[input]]
name = "Pad page right (shift, key shift mode)"
note = 0x00
channel = "deck"
action = "ignore"

# ---------------------------------------------------------------- pads
[[input]]
name = "Hot cue pad"
note = 0x00
repeat = 8
index_arg = "slot"
channel = "pad"
action = "deck.hot_cue"

[[input]]
name = "Hot cue pad (shift)"
note = 0x00
repeat = 8
index_arg = "slot"
channel = "pad_shift"
action = "deck.hot_cue_delete"

[[input]]
name = "Hold FX 1 pad"
note = 0x10
repeat = 8
index_arg = "index"
channel = "pad"
action = "deck.pad"

[[input]]
name = "Beat jump pad"
note = 0x20
repeat = 8
channel = "pad"
action = "deck.beat_jump"
args = { beats = [-1.0, 1.0, -2.0, 2.0, -4.0, 4.0, -8.0, 8.0] }

# Sampler pads: the sixteen-note block of the sampler pad mode. On the
# owner's unit the eight pads sent 0x38-0x3F after the pad page buttons
# moved to the second page (2026-11-13): slots 9-16 of the bank.
[[input]]
name = "Sampler pad"
note = 0x30
repeat = 16
index_arg = "slot"
channel = "pad"
action = "sampler.pad"

[[input]]
name = "Sampler pad (shift)"
note = 0x30
repeat = 16
index_arg = "slot"
channel = "pad_shift"
action = "sampler.stop"

[[input]]
name = "Keyboard pad"
note = 0x40
repeat = 8
index_arg = "index"
channel = "pad"
action = "deck.pad"

[[input]]
name = "Hold FX 2 pad"
note = 0x50
repeat = 8
index_arg = "index"
channel = "pad"
action = "deck.pad"

[[input]]
name = "Beat loop pad"
note = 0x60
repeat = 8
channel = "pad"
action = "deck.loop_roll"
args = { beats = [0.0625, 0.125, 0.25, 0.5, 1.0, 2.0, 4.0, 8.0] }

[[input]]
name = "Key shift pad"
note = 0x70
repeat = 8
index_arg = "index"
channel = "pad"
action = "deck.pad"

# Page 2 of each pad mode: the page 1 block + 8 [L]. The app has one page
# of hot cues and pads per mode, so page 2 plays the same ones; beat jump
# page 2 jumps further. (Sampler page 2 is part of the block above.)
[[input]]
name = "Hot cue pad (page 2)"
note = 0x08
repeat = 8
index_arg = "slot"
channel = "pad"
action = "deck.hot_cue"

[[input]]
name = "Hot cue pad (page 2, shift)"
note = 0x08
repeat = 8
index_arg = "slot"
channel = "pad_shift"
action = "deck.hot_cue_delete"

[[input]]
name = "Hold FX 1 pad (page 2)"
note = 0x18
repeat = 8
index_arg = "index"
channel = "pad"
action = "deck.pad"

[[input]]
name = "Beat jump pad (page 2)"
note = 0x28
repeat = 8
channel = "pad"
action = "deck.beat_jump"
args = { beats = [-16.0, 16.0, -32.0, 32.0, -64.0, 64.0, -128.0, 128.0] }

[[input]]
name = "Keyboard pad (page 2)"
note = 0x48
repeat = 8
index_arg = "index"
channel = "pad"
action = "deck.pad"

[[input]]
name = "Hold FX 2 pad (page 2)"
note = 0x58
repeat = 8
index_arg = "index"
channel = "pad"
action = "deck.pad"

[[input]]
name = "Beat loop pad (page 2)"
note = 0x68
repeat = 8
channel = "pad"
action = "deck.loop_roll"
args = { beats = [0.0625, 0.125, 0.25, 0.5, 1.0, 2.0, 4.0, 8.0] }

[[input]]
name = "Key shift pad (page 2)"
note = 0x78
repeat = 8
index_arg = "index"
channel = "pad"
action = "deck.pad"

# Pads with SHIFT in the other modes (both pages) [L]: no function yet.
[[input]]
name = "Hold FX 1 pad (shift)"
note = 0x10
repeat = 16
channel = "pad_shift"
action = "ignore"

[[input]]
