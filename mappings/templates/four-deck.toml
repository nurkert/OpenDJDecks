# OpenDJDecks controller template: Four decks.
#
# SPDX-License-Identifier: GPL-3.0-or-later
# A generic list of the core controls of this class of controller, in
# the order the guided setup (Preferences > Controller) asks for them.
# It names no model and holds no MIDI numbers: the setup fills them in
# from the owner's own unit and writes a mapping file from them.
# Four decks: on units that switch decks with a layer key, select the deck
# on the unit before moving its controls.

template = 1
id = "four-deck"
name = "Four decks"
decks = 4
module = "jog-controller"

[[step]]
action = "deck.play_pause"
deck = 1
expect = "button"
name = "Play/Pause (deck 1)"
screen = "deck1.play"

[[step]]
action = "deck.cue"
deck = 1
expect = "button"
name = "Cue (deck 1)"
screen = "deck1.cue"

[[step]]
action = "deck.sync"
deck = 1
expect = "button"
name = "Sync (deck 1)"
screen = "deck1.beat-sync"

[[step]]
action = "deck.jog_touch"
deck = 1
expect = "button"
name = "Jog touch (deck 1)"

[[step]]
action = "deck.jog_turn"
deck = 1
args = { mode = "scratch" }
expect = "wheel"
name = "Jog wheel (deck 1)"

[[step]]
action = "deck.tempo"
deck = 1
expect = "fader"
name = "Tempo fader (deck 1)"
screen = "deck1.pitch"

[[step]]
action = "deck.load"
deck = 1
expect = "button"
name = "Load (deck 1)"

[[step]]
