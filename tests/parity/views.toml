# ---- Perform: 4 decks horizontal ----
[[view.kiosk]]
omit = [
  "deck1.pad.A",
  "deck1.pad.B",
  "deck1.pad.C",
  "deck1.pad.D",
  "deck1.pad.E",
  "deck1.pad.F",
  "deck1.pad.G",
  "deck1.pad.H",
  "deck2.pad.A",
  "deck2.pad.B",
  "deck2.pad.C",
  "deck2.pad.D",
  "deck2.pad.E",
  "deck2.pad.F",
  "deck2.pad.G",
  "deck2.pad.H",
  "deck1.pad-mode",
  "deck2.pad-mode",
]
reason = "Pads and pad modes are the controller’s eight performance pads per deck and its pad-mode buttons (HOT CUE, HOLD FX, BEAT JUMP, SAMPLER, KEYBOARD, …)."

[[view.kiosk]]
omit = [
  "deck1.loop.size",
  "deck1.loop.halve",
  "deck1.loop.double",
  "deck1.loop.auto",
  "deck1.loop.manual",
  "deck2.loop.size",
  "deck2.loop.halve",
  "deck2.loop.double",
  "deck2.loop.auto",
  "deck2.loop.manual",
]
reason = "The loop section of each controller deck: LOOP IN / OUT, 4-beat loop / EXIT and the ½ / ×2 keys."

[[view.kiosk]]
omit = [
  "deck1.pitch",
  "deck2.pitch",
  "deck1.tempo-mode",
  "deck2.tempo-mode",
]
reason = "The tempo fader of each controller deck, and its range (cycled on the controller); the platter read-out on screen shows tempo and range."

[[view.kiosk]]
omit = [
  "mixer.ch1.trim",
  "mixer.ch1.eq-high",
  "mixer.ch1.eq-mid",
  "mixer.ch1.eq-low",
  "mixer.ch1.cue",
  "mixer.ch1.fader",
  "mixer.ch2.trim",
  "mixer.ch2.eq-high",
  "mixer.ch2.eq-mid",
  "mixer.ch2.eq-low",
  "mixer.ch2.cue",
  "mixer.ch2.fader",
]
reason = "The channel strips of the controller’s mixer: TRIM, EQ HI / MID / LOW, headphone CUE and channel fader. The channel’s STEM switch (part isolation of those EQ knobs) stays on screen in each deck row."

[[view.kiosk]]
omit = [
  "global.phones.mix",
  "global.phones.level",
]
reason = "Headphone MIX and LEVEL knobs of the controller."

[[view.kiosk]]
omit = [
  "global.xfader",
  "global.xf-a.deck1",
  "global.xf-a.deck2",
  "global.xf-a.deck3",
  "global.xf-a.deck4",
  "global.xf-b.deck1",
  "global.xf-b.deck2",
  "global.xf-b.deck3",
  "global.xf-b.deck4",
]
reason = "The controller’s crossfader and its crossfader assign switches."

[[view.kiosk]]
omit = [
  "topbar.master-volume",
]
reason = "The controller’s MASTER LEVEL knob; the master meter stays on screen."

[[view.kiosk]]
omit = [
  "browser.density",
  "browser.header.attribute",
  "browser.header.columns",
  "browser.header.filter",
  "browser.list-title",
  "browser.panel.info",
  "browser.panel.user-tag",
  "browser.panel.similar",
  "browser.panel.sampler",
  "browser.panel.sub-browser",
  "browser.rail.collection",
  "browser.rail.devices",
  "browser.rail.explorer",
  "browser.rail.histories",
  "browser.rail.playlists",
  "browser.rail.recordings",
  "browser.rail.similar",
  "browser.rail.sampler",
  "browser.rail.tag-list",
  "browser.rows",
  "browser.search",
  "browser.splitter",
  "browser.target",
  "browser.tree",
]
reason = "On the kiosk’s browse screen, one touch (topbar.layout BROWSE) or the controller’s browse encoder away; the decks screen keeps the decks readable at 44 px."
shown_in = "perform.browse"

[[view]]
