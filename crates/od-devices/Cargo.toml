[package]
name = "od-devices"
description = "USB stick detection, registration and incremental sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
od-core.workspace = true
od-library.workspace = true
od-decode.workspace = true
od-format-native.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
crossbeam-channel.workspace = true
blake3.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
tempfile.workspace = true
